name: tusome-backend

# ─────────────────────────────────────────────────────────────
# Common anchor — all app containers share this config
# ─────────────────────────────────────────────────────────────
x-app-common: &app-common
  build: .
  env_file:
    - .env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:

  # ── FastAPI HTTP server ──────────────────────────────────
  api:
    <<: *app-common
    container_name: tusome-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  # ── Celery worker (handles email queue, payment tasks) ───
  worker:
    <<: *app-common
    container_name: tusome-worker
    command: >
      celery -A app.tasks.celery_app worker
      --loglevel=info
      --pool=threads
      --concurrency=8
      --queues=default
    restart: unless-stopped

  # ── Celery beat (cron scheduler) ─────────────────────────
  beat:
    <<: *app-common
    container_name: tusome-beat
    command: >
      celery -A app.tasks.celery_app beat
      --loglevel=info
      --scheduler celery.beat:PersistentScheduler
    restart: unless-stopped

  # ── Flower (task monitoring UI at :5555) ─────────────────
  flower:
    <<: *app-common
    container_name: tusome-flower
    command: >
      celery -A app.tasks.celery_app flower
      --port=5555
      --basic_auth=admin:tusome_flower_pass
    ports:
      - "5555:5555"
    restart: unless-stopped

  # ── PostgreSQL ────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: tusome-db
    environment:
      POSTGRES_DB: tusome_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tusome-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes   # persist data across restarts

volumes:
  pgdata:
  redisdata:
